<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Import data – Model Segregation Manager</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>body{font:14px system-ui,Segoe UI,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;color:#14212b}button{padding:9px 14px;border-radius:8px;border:1px solid #245f80;background:#245f80;color:#fff;cursor:pointer;font-weight:600}#log{white-space:pre-wrap;background:#f6f8fa;border:1px solid #d5dce2;border-radius:8px;padding:10px;min-height:60px}</style></head>
<body><h1>Import data</h1>
<p>One-time step for the Super Admin: load the <b>msm-data-backup.json</b> file downloaded from the Claude app. Team roles are not imported (people get new IDs here); add them again in the Team tab.</p>
<p><button id="si">1. Sign in with Google</button> <span id="who"></span></p>
<p><input type="file" id="f" accept=".json"> <button id="go" disabled>2. Import</button></p>
<div id="log"></div>
<script>
firebase.initializeApp(MSM_FIREBASE.firebase);const auth=firebase.auth(),fs=firebase.firestore();const log=t=>document.getElementById('log').textContent+=t+'\n';
document.getElementById('si').onclick=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>log(e.message));
auth.onAuthStateChanged(u=>{document.getElementById('who').textContent=u?'Signed in as '+u.email:'';document.getElementById('go').disabled=!u;if(u&&u.email.toLowerCase()!==String(MSM_FIREBASE.ownerEmail).toLowerCase())log('Warning: only '+MSM_FIREBASE.ownerEmail+' can import.')});
document.getElementById('go').onclick=async()=>{const f=document.getElementById('f').files[0];if(!f){log('Choose the backup file first.');return}
  const data=JSON.parse(await f.text());const entries=Object.entries(data.docs||{}).filter(([p])=>p!=='team/roster');
  log(`Importing ${entries.length} records…`);let n=0;
  for(let i=0;i<entries.length;i+=400){const b=fs.batch();for(const [p,d] of entries.slice(i,i+400))b.set(fs.doc(p),d);try{await b.commit();n+=Math.min(400,entries.length-i);log(`${n} / ${entries.length}`)}catch(e){log('Failed: '+e.message);return}}
  log('Done. Open index.html.')};
</script></body></html>
