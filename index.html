<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="firebase-shim.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Segregation Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a BIM coordination console — navy top bar, tabbed work area, dense tables with discipline stripes */
:root{
  --bg:#eef1f4; --panel:#ffffff; --panel-2:#f6f8fa; --ink:#14212b; --muted:#5b6974; --line:#d5dce2;
  --accent:#1f3a4d; --accent-ink:#ffffff; --hdr:#1f3a4d; --hdr-ink:#ffffff; --accent-soft:#e3ecf2; --link:#245f80;
  --m-self:#9fb3c2; --m-o:#d6e8f7; --m-a:#ffdcae; --m-m:#e8f1fa; --m-p:#ffe9cc;
  --warn:#9a4a00; --warn-bg:#fff2df; --bad:#b42318; --bad-bg:#fdeceb; --good:#0b6b43;
  --d-GN:#8a96a0; --d-ARC:#5f8f3e; --d-STR:#7d7d7d; --d-INT:#b0577e; --d-LSD:#2f8f7f; --d-MEC:#2f6fa8; --d-PLU:#3f8f55; --d-ELE:#c08a14; --d-ELV:#7a55a8;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f161c; --panel:#162029; --panel-2:#1b2731; --ink:#e4ebf0; --muted:#97a6b2; --line:#2a3946;
  --accent:#9cc3db; --accent-ink:#0f161c; --hdr:#122433; --hdr-ink:#e4ebf0; --accent-soft:#1f3341; --link:#8ec2e2;
  --m-self:#3c5262; --m-o:#1e3d57; --m-a:#5a3b10; --m-m:#1b3042; --m-p:#4a3416;
  --warn:#f0b46a; --warn-bg:#3a2a12; --bad:#f39a90; --bad-bg:#3c1d1a; --good:#7dd3a8;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f161c; --panel:#162029; --panel-2:#1b2731; --ink:#e4ebf0; --muted:#97a6b2; --line:#2a3946;
  --accent:#9cc3db; --accent-ink:#0f161c; --hdr:#122433; --hdr-ink:#e4ebf0; --accent-soft:#1f3341; --link:#8ec2e2;
  --m-self:#3c5262; --m-o:#1e3d57; --m-a:#5a3b10; --m-m:#1b3042; --m-p:#4a3416;
  --warn:#f0b46a; --warn-bg:#3a2a12; --bad:#f39a90; --bad-bg:#3c1d1a; --good:#7dd3a8;
  color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-feature-settings:'cv11','ss01';letter-spacing:-.005em;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12.5px}
td.mono{white-space:nowrap}
header{background:var(--hdr);color:var(--hdr-ink);padding:14px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
.vdiv{width:1px;align-self:stretch;background:color-mix(in srgb,var(--hdr-ink) 30%,transparent);margin:2px 0}
.ttl{display:flex;flex-direction:column;gap:2px;min-width:0}
.ver{font-family:var(--mono);font-size:11px;font-weight:500;background:color-mix(in srgb,var(--hdr-ink) 16%,transparent);border-radius:999px;padding:1px 8px;margin-left:10px;vertical-align:middle}
.subt{font-size:12.5px;opacity:.75}
.tiles{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tile{background:color-mix(in srgb,var(--hdr-ink) 11%,transparent);border-radius:8px;padding:7px 14px;min-width:96px}
.tile .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;opacity:.75}
.tile .v{font-family:var(--font);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile.bad .v{color:#ffb4a8}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;background:var(--panel);border-bottom:1px solid var(--line);padding-right:16px}
.bar-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:6px 0 6px 16px}
header h1{font-size:19px;margin:0;font-weight:600;letter-spacing:.2px;display:flex;align-items:center}
.home{color:inherit;text-decoration:none}
.home:hover{text-decoration:underline;text-underline-offset:3px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.pcard:hover{border-color:var(--link)}
.pcard.cur{border-color:var(--link);box-shadow:0 0 0 1px var(--link)}
.pcard .code{font-family:var(--mono);font-weight:600;font-size:15px}
.pcard .meta{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.pcard.new{align-items:center;justify-content:center;border-style:dashed;color:var(--muted);min-height:120px;font-weight:600}
.brand{height:42px;width:auto;display:block;flex:none}
.brandlink{display:block;line-height:0}
.logo{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;background:#fff;border-radius:6px;padding:3px 8px;height:34px;min-width:34px;color:#1f3a4d;font-size:12px;font-weight:600;border:1px dashed transparent}
.logo img{max-height:28px;max-width:160px;display:block}
.logo.empty{background:transparent;color:var(--hdr-ink);border-color:color-mix(in srgb,var(--hdr-ink) 45%,transparent)}
.logo:focus-visible{outline:2px solid #fff;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.projsel{font-family:var(--mono);font-size:13px;max-width:300px}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;opacity:.9;font-variant-numeric:tabular-nums}
.stats b{font-weight:600}
.hdr-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--link)}
.btn.primary{background:var(--link);border-color:var(--link);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
header .btn{background:transparent;color:var(--hdr-ink);border-color:color-mix(in srgb,var(--hdr-ink) 45%,transparent)}
header .btn:hover{background:color-mix(in srgb,var(--hdr-ink) 12%,transparent)}
nav.tabs{display:flex;gap:2px;padding:0 16px;overflow-x:auto}
nav.tabs a{padding:10px 14px;color:var(--muted);text-decoration:none;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--link)}
nav.tabs a .count{font-size:11px;color:var(--muted);margin-left:4px}
.banner{padding:8px 20px;font-size:13px;background:var(--warn-bg);color:var(--warn);border-bottom:1px solid var(--line)}
.banner[hidden]{display:none}
main{flex:1;overflow:auto;padding:16px 20px 40px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1}
input[type=search],input[type=text],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
input[type=search]{min-width:240px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px}
.scroll{overflow:auto}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th+th,td+td{border-left:1px solid color-mix(in srgb,var(--line) 65%,transparent)}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600;background:var(--panel-2);position:sticky;top:0;z-index:1;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.sep td{background:var(--panel-2);font-weight:600;font-size:12px;letter-spacing:.3px;padding:7px 8px;border-left:4px solid var(--dc,var(--line))}
tr.dhead{cursor:pointer;user-select:none}
tr.dhead td{background:color-mix(in srgb,var(--dc) 16%,var(--panel));color:var(--ink);font-size:13.5px;font-weight:600;padding:10px 12px;border-left:6px solid var(--dc);border-top:1px solid color-mix(in srgb,var(--dc) 35%,transparent)}
tr.dhead:hover td{background:color-mix(in srgb,var(--dc) 24%,var(--panel))}
tr.dhead:focus-visible{outline:2px solid var(--link);outline-offset:-2px}
tr.dhead .chev{display:inline-block;width:16px;color:var(--dc)}
tr.dhead .dcode{display:inline-block;background:var(--dc);color:#fff;border-radius:5px;padding:1px 8px;margin-right:8px;font-size:12px;letter-spacing:.4px}
tr.dhead .dcount{margin-left:12px;font-weight:500;font-size:12px;color:var(--muted)}
tr.dhead .dnum{display:inline-flex;align-items:baseline;gap:4px;margin-left:14px;background:var(--panel);border:1px solid color-mix(in srgb,var(--dc) 45%,transparent);border-radius:999px;padding:1px 10px;font-size:14px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
tr.dhead .dnum small{font-size:11px;font-weight:500;color:var(--muted)}
tr.dhead .dbreak{margin-left:12px;font-weight:400;font-size:12px;color:var(--muted)}
tr.dhead .dcount.bad{color:#b3261e}
tbody tr.row{cursor:pointer}
tbody tr.row:hover td{background:var(--accent-soft)}
td.stripe{border-left:4px solid var(--dc,var(--line));width:34px;color:var(--muted);font-variant-numeric:tabular-nums}
.name{font-family:var(--mono);font-size:12.5px;font-weight:500;white-space:nowrap}
.sub{color:var(--muted);font-size:12px}
.tag{display:inline-block;font-family:var(--mono);font-size:11.5px;border-radius:4px;padding:0 5px;margin:1px 3px 1px 0;border:1px solid var(--line);white-space:nowrap}
.tag.o{background:var(--m-o);border-color:transparent}
.tag.a{background:var(--m-a);border-color:transparent}
.tag.m{background:var(--m-m)}
.tag.p{background:var(--m-p)}
.tag.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.tag.dt{background:color-mix(in srgb,var(--dc) 15%,var(--panel));border-color:color-mix(in srgb,var(--dc) 45%,transparent);color:color-mix(in srgb,var(--dc) 70%,var(--ink));font-weight:500}
.tag.dt.a,.tag.dt.p{border-style:dashed}
.tag.dt.m,.tag.dt.p{box-shadow:inset 3px 0 0 var(--dc)}
.pill{display:inline-block;font-size:11.5px;border-radius:999px;padding:0 8px;background:var(--panel-2);border:1px solid var(--line);white-space:nowrap}
.issue{color:var(--bad);font-size:12px}
.issue-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-left:6px;vertical-align:middle}
.row-actions{white-space:nowrap}
.row-actions .btn{padding:3px 7px;font-size:12px}
/* matrix */
.matrix{border-collapse:separate;border-spacing:0;width:auto}
.matrix th,.matrix td{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;text-align:center}
.matrix thead th{position:sticky;top:0;z-index:2;background:var(--accent);color:var(--accent-ink);text-transform:none;letter-spacing:0;font-family:var(--mono);font-size:10.5px;font-weight:500;line-height:1.15;padding:6px 2px;min-width:44px;vertical-align:bottom}
.matrix thead tr.cnt th{top:var(--hh,96px);background:var(--panel-2);color:var(--muted);font-family:var(--font);font-size:11px;padding:3px}
.matrix th.host{position:sticky;left:0;z-index:3;text-align:left;min-width:260px;padding:4px 8px;font-family:var(--mono);font-size:12px;background:var(--panel);color:var(--ink);text-transform:none;letter-spacing:0;font-weight:500;border-left:4px solid var(--dc,var(--line))}
.matrix thead tr.frow th{top:29px;padding:3px 4px;background:var(--panel-2);text-transform:none}
thead tr.frow input,thead tr.frow select{width:100%;min-width:90px;font:inherit;font-size:11.5px;padding:3px 5px;box-sizing:border-box}
thead th.host{z-index:4;background:var(--accent);color:var(--accent-ink);font-family:var(--font);border-left-color:var(--accent)}
.matrix thead tr.cnt th.host{background:var(--panel-2);color:var(--muted)}
.matrix td.links{position:sticky;left:260px;z-index:1;background:var(--panel);font-weight:600;min-width:46px;font-variant-numeric:tabular-nums;border-right:2px solid var(--line)}
.matrix thead th.links{left:260px;z-index:4}
.matrix td.cell{width:44px;height:26px;font-weight:600;font-size:12.5px;cursor:pointer;background:var(--panel)}
.matrix td.cell:hover{outline:2px solid var(--link);outline-offset:-2px}
.matrix td.cell.locked{cursor:default}
.matrix td.cell.locked:hover{outline:none}
.matrix td.v-self{background:var(--m-self)}
.matrix td.v-O{background:var(--m-o)}
.matrix td.v-A{background:var(--m-a)}
.matrix td.v-M{background:var(--m-m)}
.matrix td.v-P{background:var(--m-p)}
.matrix tr.newdisc th,.matrix tr.newdisc td{border-top:2px solid var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);margin:10px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:20px;height:16px;border-radius:3px;text-align:center;font-weight:600;font-size:11px;line-height:16px;color:var(--ink);border:1px solid var(--line)}
/* worksets */
.ws-block td{font-size:13px}
.ws-block tr.first td{border-top:2px solid var(--accent)}
.ws-block td.model{font-family:var(--mono);font-size:12px;font-weight:600;width:300px;border-left:4px solid var(--dc,var(--line))}
.ws-block td.ws{font-family:var(--mono);font-size:12.5px}
.ws-block tr.link td.ws,.ws-block tr.link td.d{color:var(--muted)}
.ws-block tr.link td{background:var(--panel-2)}
/* structure */
.sgrid{display:grid;grid-template-columns:150px repeat(4,minmax(180px,1fr));gap:6px;min-width:900px}
.sgrid .h{background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:12px;padding:8px;border-radius:6px;text-align:center}
.sgrid .d{border-radius:6px;padding:8px;font-weight:600;font-size:12.5px;display:flex;align-items:center;justify-content:center;text-align:center;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--dc)}
.sgrid .c{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px;font-family:var(--mono);font-size:11.5px;display:flex;flex-direction:column;gap:2px;justify-content:center;align-items:center;text-align:center}
.sgrid .c.empty{color:var(--muted)}
.shared{margin:0 auto 14px;max-width:420px;text-align:center;padding:10px;border-radius:8px;background:var(--m-self);font-weight:600;font-size:13px}
.shared div{font-family:var(--mono);font-weight:500;font-size:12px}
.hier{display:grid;grid-template-columns:minmax(160px,240px) 30px minmax(200px,320px) minmax(160px,1fr);gap:6px 8px;align-items:center;margin-top:8px}
.hier .b{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-family:var(--mono);font-size:12px;background:var(--panel)}
.hier .arrow{text-align:center;color:var(--muted);font-size:16px}
.hier .t{font-size:12.5px;color:var(--muted)}
h2{font-size:15px;margin:22px 0 8px}
h2:first-child{margin-top:4px}
.hint{color:var(--muted);font-size:12.5px;margin:4px 0 12px;max-width:80ch}
/* codes */
.codes-grid{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start}
.setlist{display:flex;flex-direction:column}
.setlist button{all:unset;cursor:pointer;padding:7px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-family:var(--mono);font-size:12.5px}
.setlist button[aria-pressed="true"]{background:var(--accent-soft);font-weight:600}
.edit-table input{width:100%;border:1px solid transparent;background:transparent;padding:4px 6px;border-radius:4px}
.edit-table input:hover,.edit-table input:focus{border-color:var(--line);background:var(--panel)}
.field-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.field-row label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.savebar{position:sticky;bottom:0;display:flex;gap:8px;justify-content:flex-end;padding:10px 0;background:linear-gradient(transparent,var(--bg) 30%)}
/* dialog */
.overlay{position:fixed;inset:0;background:rgba(10,18,24,.45);display:flex;justify-content:flex-end;z-index:50}
.overlay.center{justify-content:center;align-items:center}
.drawer{background:var(--panel);width:min(760px,100%);height:100%;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
.drawer header{background:var(--panel);color:var(--ink);border-bottom:1px solid var(--line)}
.drawer .body{flex:1;overflow:auto;padding:16px 20px}
.drawer footer{border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:8px;justify-content:flex-end;align-items:center}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.form .w2{grid-column:span 2}.form .w4{grid-column:1/-1}
.form input,.form select{width:100%}
.namebox{display:flex;gap:6px}
.namebox input{flex:1;font-family:var(--mono)}
.picker{border:1px solid var(--line);border-radius:8px;max-height:420px;overflow:auto}
.picker .pg{background:var(--panel-2);font-size:11.5px;font-weight:600;padding:5px 10px;position:sticky;top:0;border-left:4px solid var(--dc)}
.picker .pi{display:flex;align-items:center;justify-content:space-between;padding:4px 10px;border-bottom:1px solid var(--line);gap:8px}
.picker .pi .k{font-family:var(--mono);font-size:12.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:2px 9px;font-size:12px;font-weight:600;border-left:1px solid var(--line);color:var(--muted)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg button[data-v=""][aria-pressed="true"]{background:var(--panel-2)}
.seg button[data-v="O"][aria-pressed="true"]{background:var(--m-o)}
.seg button[data-v="A"][aria-pressed="true"]{background:var(--m-a)}
.seg button[data-v="M"][aria-pressed="true"]{background:var(--m-m);outline:1px solid var(--line)}
.seg button[data-v="P"][aria-pressed="true"]{background:var(--m-p)}
.seg button:focus-visible{outline:2px solid var(--link);outline-offset:-2px}
.modal{background:var(--panel);border-radius:10px;padding:20px;width:min(480px,92vw);box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h3{margin:0 0 8px;font-size:16px}
.modal p{margin:0 0 14px;color:var(--muted)}
.modal .acts{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:60}
.empty-state{padding:40px;text-align:center;color:var(--muted)}
@media (max-width:700px){header{padding:10px 16px}main{padding:12px 16px 40px}.form{grid-template-columns:1fr 1fr}.codes-grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
#acc table td{padding:4px 12px 4px 0;vertical-align:top}
#homeBar,#projBar{position:relative}
#homeBar[hidden],#projBar[hidden]{display:none!important}
.crumbbar{padding-left:16px}
.crumb{display:flex;align-items:center;gap:10px;padding:8px 0;min-width:0}
.crumb .back{color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap}
.crumb .back:hover{color:var(--link)}
.crumb .sep{color:var(--line)}
.crumb .projsel{font-family:var(--mono);font-weight:600;font-size:15px;border:1px solid transparent;background:transparent;padding:4px 6px;border-radius:6px;color:var(--ink)}
.crumb .projsel:hover{border-color:var(--line)}
nav.ptabs{background:var(--panel);border-bottom:1px solid var(--line)}
#homeTabs a{font-weight:600}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 14px}
.pcard .open{margin-top:auto;padding-top:8px;color:var(--link);font-weight:600;font-size:13px}
.pcard{min-height:130px;transition:border-color .15s,box-shadow .15s,transform .15s}
.pcard:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.08)}
details.roles{margin-top:22px}details.roles summary{cursor:pointer;list-style-position:outside}
.pcard{position:relative}
.pcard .pdel{position:absolute;top:10px;right:12px;font-size:12px;font-weight:600;color:var(--bad,#b3261e);opacity:0;padding:2px 6px;border-radius:5px}
.pcard:hover .pdel,.pcard:focus-within .pdel,.pcard .pdel:focus{opacity:1}
.pcard .pdel:hover{background:color-mix(in srgb,#b3261e 12%,transparent)}
@media (hover:none){.pcard .pdel{opacity:1}}
.gpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:8px 0 12px}
.gpick .ghead{display:flex;gap:8px;align-items:baseline;margin-bottom:6px}
.gchk{display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer}
button,input,select,textarea{font-family:inherit;-webkit-font-smoothing:antialiased}
.mono,td.mono{font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:.01em}
[style*="var(--mono)"],.code{font-variant-numeric:tabular-nums}
.sumcard{margin:16px 0 0;padding:0}
.sumcard summary{cursor:pointer;padding:10px 14px;display:flex;gap:12px;align-items:baseline;list-style:none}
.sumcard summary::-webkit-details-marker{display:none}
.sumcard summary::before{content:'▸';color:var(--muted);width:10px}
.sumcard[open] summary::before{content:'▾'}
.sumtable{width:auto;min-width:620px;margin:0 14px 12px}
.sumtable th,.sumtable td{padding:6px 14px}
.sumtable .num{text-align:right;font-variant-numeric:tabular-nums}
.sumtable tbody tr{cursor:pointer}
.sumtable tbody tr td:first-child{border-left:4px solid var(--dc)}
.sumtable tbody tr:hover td{background:color-mix(in srgb,var(--dc) 10%,var(--panel))}
.sumtable .dcode{display:inline-block;min-width:34px;text-align:center;background:var(--dc);color:#fff;border-radius:5px;padding:0 6px;margin-right:8px;font-size:11.5px;font-weight:600}
.sumtable .tot{font-weight:700}
.sumtable tfoot td{font-weight:700;border-top:2px solid var(--line)}
tr.fxdone td{opacity:.55}
tr.dhead .ddel{float:right;opacity:0;padding:2px 10px;font-size:12px;margin:-3px 0}
tr.dhead:hover .ddel,tr.dhead .ddel:focus{opacity:1}
@media (hover:none){tr.dhead .ddel{opacity:1}}
.lcbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 14px;margin:0 0 10px}
.lcbar .grow{flex:1}
.dropcover{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--accent,#0b6bcb) 14%,transparent);border:3px dashed var(--accent,#0b6bcb);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;color:var(--ink);pointer-events:none}
.lcbar .lt{font-weight:600}.lcbar .lm{color:var(--muted);font-size:12.5px}
.lcs{display:inline-flex;gap:6px;font-variant-numeric:tabular-nums;font-size:12.5px;white-space:nowrap}
.lcs .ok,.lcm.ok,.lcd .ok{color:var(--good)}.lcs .miss,.lcm.miss,.lcd .miss,.lcs .fail,.lcd .fail{color:var(--bad)}
.lcs .type,.lcm.type,.lcd .type{color:var(--warn)}.lcs .extra,.lcd .extra{color:var(--muted)}
.lcm{font-family:var(--font);font-weight:700;margin-left:3px}
.lcd{font-size:11.5px;line-height:1.45;margin-top:3px;white-space:nowrap}.lcd b{font-family:var(--mono);font-weight:500}
.lcna{color:var(--muted);font-size:12px}
.pill.ty{background:color-mix(in srgb,var(--tc) 14%,var(--panel));border-color:color-mix(in srgb,var(--tc) 40%,transparent);color:color-mix(in srgb,var(--tc) 80%,var(--ink));font-weight:500}
.modal.clr{width:min(980px,96vw);max-height:92vh;display:flex;flex-direction:column;padding:0;overflow:hidden}
.clr-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;background:var(--hdr);color:var(--hdr-ink);padding:16px 20px}
.clr-head h3{margin:0;font-size:18px;color:var(--hdr-ink)}.clr-sub{opacity:.75;font-size:12.5px;margin-top:2px}
.clr-x{background:none;border:0;color:var(--hdr-ink);font-size:24px;line-height:1;cursor:pointer;opacity:.8;padding:0 4px}.clr-x:hover{opacity:1}
.clr-body{padding:16px 20px;overflow:auto;flex:1}.clr-body h4{margin:18px 0 8px;font-size:13.5px}
.clr-tiles{display:flex;flex-wrap:wrap;gap:8px}.clr-tile{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-width:110px}
.clr-tile .k{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}.clr-tile .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.clr-tile.ok .v{color:var(--good)}.clr-tile.bad .v{color:var(--bad)}.clr-tile.muted .v{color:var(--muted)}
.clr-note{margin:10px 0 0;font-size:12.5px}.clr-note.bad{color:var(--bad)}
.clr-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}.clr-card{min-height:0!important;padding:12px 14px!important}
.clr-card .sub{font-size:12px;color:var(--muted)}.clr-card.new .code{color:var(--link)}.clr-tag{font-size:11px;color:var(--good);font-weight:600}
.clr-new{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;max-width:520px}.clr-new label{display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.clr-tools{display:flex;align-items:center;gap:8px;margin-bottom:6px}.clr-tools .grow{flex:1}
.clr-prev{max-height:42vh}.clr-count{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:6px}
.pill.clr-add{background:color-mix(in srgb,var(--good) 14%,var(--panel));color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.pill.clr-upd{background:color-mix(in srgb,var(--link) 12%,var(--panel));color:var(--link);border-color:color-mix(in srgb,var(--link) 40%,transparent)}
.clr-foot{display:flex;align-items:center;gap:8px;padding:12px 20px;border-top:1px solid var(--line);background:var(--panel-2)}.clr-foot .grow{flex:1}.clr-foot .issue{margin:0}
.pill.undo{background:#FFF1D6;color:#8A5A00;border-color:#E8C98A}
.mapwrap{position:relative;padding:0;overflow:hidden;height:calc(100vh - 290px);min-height:420px}
.mapwrap svg{display:block;cursor:grab;touch-action:none;user-select:none}.mapwrap svg.grab{cursor:grabbing}
.mapctl{position:absolute;top:10px;right:10px;display:flex;gap:6px;z-index:2;background:var(--panel);padding:4px;border-radius:8px;border:1px solid var(--line)}
.mapctl .btn{min-width:34px;padding:4px 10px}.mapctl input{width:200px}
.maphelp{position:absolute;left:12px;bottom:8px;font-size:12px;color:var(--muted);z-index:2;pointer-events:none}
.mnode:hover rect{stroke-width:2.2}
.maptog{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;margin-right:6px}
.mlk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:700}
.mlk.o{background:#E6F1FB;color:#0C447C;border:1px dashed #378ADD}.mlk.a{background:#FAEEDA;color:#633806;border:2px solid #BA7517}
.mapfocus{font-weight:700;padding:4px 12px;border-radius:999px;border:2px solid var(--dc);background:color-mix(in srgb,var(--dc) 18%,var(--panel))}
.mapmode{margin-right:10px}.mapmode button{padding:4px 12px;font-size:13px}
.lchead{display:flex;align-items:center;gap:8px;margin:18px 0 8px;font-size:15px}.lchead span{background:var(--dc);color:#fff;border-radius:5px;padding:1px 8px;font-size:12px}
.lcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}
.lcard{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--dc);border-radius:0;padding:10px 12px}
.lctop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;cursor:pointer;margin-bottom:6px}.lctop:hover b{text-decoration:underline}
.lcrow{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:5px}
.lcl{font-size:11px;font-weight:700;min-width:62px;text-transform:uppercase;letter-spacing:.3px}.lcl.a{color:#854F0B}.lcl.o{color:#185FA5}
.lchip{all:unset;cursor:pointer;display:inline-flex;gap:5px;align-items:center;font-size:12px;padding:2px 8px 2px 3px;border-radius:999px;background:color-mix(in srgb,var(--dc) 15%,var(--panel));border:1px solid color-mix(in srgb,var(--dc) 55%,transparent);color:var(--ink)}
.lchip b{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;font-size:10px}
.lchip.o{border-style:dashed}.lchip.o b{background:#E6F1FB;color:#0C447C;border:1px dashed #378ADD}
.lchip.a{border-width:2px}.lchip.a b{background:#FAEEDA;color:#633806;border:1px solid #BA7517}
.lchip:hover{background:color-mix(in srgb,var(--dc) 28%,var(--panel))}
.tm-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:8px 0 20px}.tm-head h2{font-size:25px;margin:0 0 4px}.tm-head p{margin:0}.tm-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}.tm-stat{padding:18px;min-width:0}.tm-stat strong{display:block;margin-top:8px;font-size:28px!important}.tm-notice{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:16px}.tm-nav{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow:auto}.tm-tab{background:none;border:0;border-bottom:2px solid transparent;color:inherit;padding:12px 3px;white-space:nowrap;cursor:pointer;font:inherit}.tm-tab.selected{border-bottom-color:#3b82f6;color:#3b82f6;font-weight:600}.tm-filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0}.tm-filters input{flex:1;min-width:180px}#teamContent table td{padding-top:13px;padding-bottom:13px}#teamContent tr[data-team-role="owner"] .pill{color:#a78bfa}#teamContent tr[data-team-role="admin"] select{color:#3b82f6}#teamContent tr[data-team-role="member"] select{color:#0d9488}@media(max-width:600px){.tm-head{align-items:flex-start}.tm-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.tm-nav{gap:14px}}
</style>

/* ---------------- model logic ---------------- */
const isBlankSub=s=>!s||s==='–'||s==='-';
function keyOf(name){if(!name)return'';const nm=String(name).trim();const pre=cfg?`${cfg.company}-${cfg.project}-`:'';if(pre&&nm.toUpperCase().startsWith(pre.toUpperCase()))return nm.slice(pre.length).split('-RVT').join('');const p=nm.split('-');if(p.length<3)return String(name).trim();return p.slice(2).join('-').split('-RVT').join('');}
function parseTok(arr){const plain=new Set(),one=[];for(const t of arr||[]){const s=String(t).trim();if(!s)continue;if(s.endsWith('(1)'))one.push(s.slice(0,-3));else plain.add(s)}return{plain,one}}
function lastSeg(n){const p=String(n).split('-');return p[p.length-1]}
function linkWs(c){const proj=cfg?.project||'';const mid=c.disc==='GN'?`GN-${c.zone}`:`${c.zone}${isBlankSub(c.sub)?'':'-'+c.sub}-${c.disc}`;return `${cfg?.company||''}-ZZ-LINK-${proj}-${mid}${String(c.name).includes('-RVT-')?'-RVT':''}-${lastSeg(c.name)}`;}
function discIdx(d){const L=cfg?.disciplines||Object.keys(DISC_NAMES);const i=L.indexOf(d);return i<0?99:i}
function derive(){
  /* within each discipline: by model type (Datum, Main, Typical, Sheets, Unit, Pod), then zone, then sub-zone, then name */
  const tIdx=t=>{const i=TYPES.indexOf(t);return i<0?99:i},zIdx=z=>{if(z==='SW')return -1;if(z==='OA')return 900;if(z==='FM')return 950;const i=(cfg?.zones||[]).findIndex(x=>x.code===z);return i<0?800:i};
  const top=m=>m.type==='Datum model'||/^GE?N$/i.test(m.disc)?0:1;
  const sorted=[...models].sort((a,b)=>top(a)-top(b)||discIdx(a.disc)-discIdx(b.disc)||tIdx(a.type)-tIdx(b.type)||zIdx(a.zone)-zIdx(b.zone)||String(isBlankSub(a.sub)?'':a.sub).localeCompare(String(isBlankSub(b.sub)?'':b.sub))||String(a.name).localeCompare(String(b.name),undefined,{numeric:true}));
  const groupCodes=new Set((cfg?.groups||[]).map(g=>g.code));
  const keyCount={};for(const m of sorted){const k=keyOf(m.name);keyCount[k]=(keyCount[k]||0)+1}
  const allTokens=new Set([...sorted.map(m=>keyOf(m.name)),...groupCodes]);
  const byKeyL=new Map(),byGrpL=new Map(),idxL=new Map();sorted.forEach((c,i)=>{idxL.set(c,i);const k=keyOf(c.name);(byKeyL.get(k)||byKeyL.set(k,[]).get(k)).push(c);if(c.group)(byGrpL.get(c.group)||byGrpL.set(c.group,[]).get(c.group)).push(c)});
  const info=new Map();
  for(const m of sorted){
    const k=keyOf(m.name),ov=parseTok(m.ov),at=parseTok(m.at),both=new Set([...ov.plain,...at.plain]);
    const linked=[],seenL=new Set();
    for(const t of both){for(const c of [...(byKeyL.get(t)||[]),...(byGrpL.get(t)||[])]){if(seenL.has(c))continue;seenL.add(c);const ck=keyOf(c.name);linked.push({c,t:(ov.plain.has(ck)||(c.group&&ov.plain.has(c.group)))?'O':'A'})}}
    linked.sort((a,b)=>idxL.get(a.c)-idxL.get(b.c));
    const issues=[];
    const pre=`${cfg?.company||''}-${cfg?.project||''}-`;
    if(!String(m.name||'').startsWith(pre))issues.push(`Name should start with ${pre}`);
    else{const exp=[m.disc,m.zone,...(isBlankSub(m.sub)?[]:[m.sub])].join('-')+'-';if(!String(m.name).slice(pre.length).startsWith(exp))issues.push('Name does not match Discipline / Zone / Sub-Zone')}
    if(keyCount[k]>1)issues.push('Duplicate model key');
    const unknown=[...ov.plain,...at.plain,...ov.one,...at.one].filter(t=>!allTokens.has(t));
    if(unknown.length)issues.push('Unknown link: '+unknown.join(', '));
    if(both.has(k))issues.push('Links to itself');
    if(m.group&&!groupCodes.has(m.group))issues.push('Group not in Codes');
    if(!TYPES.includes(m.type))issues.push('Model Type not set');
    else{const g=guessType(m);if((g==='Unit model'||g==='Pod model')&&m.type!==g)issues.push(`Model type should be ${g}`)}
    info.set(m.id,{k,mk:m.group||k,ov,at,linked,count:linked.length+ov.one.length+at.one.length,issues,unknown:new Set(unknown)});
  }
  const entries=[],byMk=new Map();
  for(const m of sorted){const i=info.get(m.id);let e=byMk.get(i.mk);if(!e){e={mk:i.mk,rep:m,members:[],disc:m.disc,group:m.group||''};byMk.set(i.mk,e);entries.push(e)}e.members.push(m)}
  return{sorted,info,entries,byMk,groupCodes};
}
let D=null;
function cellVal(host,col){
  if(host.mk===col.mk)return'■';
  const i=D.info.get(host.rep.id);
  if(i.ov.plain.has(col.mk))return'O';if(i.at.plain.has(col.mk))return'A';
  if(i.ov.one.includes(col.mk))return'M';if(i.at.one.includes(col.mk))return'P';return'';
}

function worksetRows(e){

  for(const [w,d] of (cfg?.sets?.[m.set]?.items||[]))rows.push({ws:w,d,type:'Standard'});

/* Read model file names from pasted text or an exported file list, check them against this project's codes, then add the chosen ones. */
function parseModelName(raw){
  const name=String(raw).trim().replace(/\.rvt$/i,'');const pre=`${cfg.company}-${cfg.project}-`;
  const mine=name.toUpperCase().startsWith(pre.toUpperCase());
  const rest=mine?name.slice(pre.length):name.split('-').slice(2).join('-');
  const t=rest.split('-');const ri=t.findIndex(x=>x.toUpperCase()==='RVT');
  const disc=t[0]||'',zone=t[1]||'',sub=(ri>2?t.slice(2,ri).join('-'):'')||'–';
  const issues=[];if(!mine)issues.push(`does not start with ${pre}`);
  if(!(cfg.disciplines||[]).includes(disc))issues.push(`discipline ${disc||'?'} not in Codes`);
  if(!(cfg.zones||[]).some(z=>z.code===zone))issues.push(`zone ${zone||'?'} not in Codes`);
  if(ri<0)issues.push('no RVT part');
  const exists=models.some(x=>keyOf(x.name)===keyOf(name));
  return{name,disc,zone,sub,type:disc==='GN'?'Datum model':isBlankSub(sub)?'Main model':'Typical model',issues,exists,mine,pick:!exists&&mine&&!issues.length};
}
function extractNames(text){
  const out=new Set();
  for(const tok of String(text).match(/[A-Za-z0-9][A-Za-z0-9._-]*/g)||[]){
    if(!/\.rvt$/i.test(tok)&&!/-RVT-[0-9A-Za-z]+$/i.test(tok))continue;
    const n=tok.replace(/\.rvt$/i,'').replace(/\.\d{4}$/,'');if(/-RVT-/i.test(n))out.add(n)}
  return[...out];
}

function stdRows(ds,zs,withUP){

  const bz=zs.filter(z=>!['SW','OA','FM'].includes(z));const hasOA=zs.includes('OA')||true;
  const k=(d,z,sub)=>`${d}-${z}${sub?'-'+sub:''}-0001`;const plan=[];
  if(ds.includes('GN'))plan.push({disc:'GN',zone:'SW',sub:'',type:'Datum model',desc:'Shared Levels & Grids',content:STD.GN.c,levels:'All levels',set:'GN'});
  for(const d of ds){if(d==='GN')continue;const nm=STD[d]?.n||DISC_NAMES[d]||d;
    for(const z of bz)plan.push({disc:d,zone:z,sub:'',type:'Main model',desc:`${nm} – ${zl(z)}`,content:STD[d]?.c||'',levels:`${zl(z)} levels (TBC)`,set:d});
    plan.push({disc:d,zone:'OA',sub:'',type:'Main model',desc:`${nm} – ${zl('OA')}`,content:STD[d]?.c||'',levels:'Basement + podium levels (TBC)',set:d});
    plan.push({disc:d,zone:'OA',sub:'SH',type:'Sheets model',desc:`${nm} – Sheets`,content:`All ${nm.toLowerCase()} sheets`,levels:'All levels (views/sheets only)',set:MEP.includes(d)?'MEP-SH':d+'-SH'})}

    for(const u of ['U1','U2','U3'])up.push({disc:d,zone:host,sub:u,type:'Unit model',group:d+'-UNITS',desc:`${nm} – ${u.slice(1)} Bedroom Unit`,content:d==='ARC'?'Unit layout: internal walls, doors, floors, ceilings, rooms, fixtures':'Unit interiors: finishes, ceilings, joinery, furniture, fixtures',levels:'Typical unit – placed on residential levels',set:d+'-UNIT',parent:`${d}-${host}-0001`,
      ov:d==='INT'&&ds.includes('ARC')?['ARC-UNITS']:[],at:[d+'-PODS']});

  const have=new Set([...models.map(x=>keyOf(x.name)),...plan.map(r=>k(r.disc,r.zone,r.sub))]);

  for(const r of plan){const ov=[],d=r.disc,me=k(d,r.zone,r.sub);
    if(d==='GN'){r.ov=[];continue}

    if(r.sub==='SH'){for(const z of [...bz,'OA'])for(const x of ['ARC','STR',d])add(ov,k(x,z,''))}

  plan.push(...up);

}

    keyRule:'Model key = file name without the company-project- prefix and without -RVT (e.g. 360-AM-10-ARC-TA-RVT-0001 -> ARC-TA-0001). Tokens ending (1) mean one matching model of the group.',
    groups:[...gm].map(([code,keys])=>({code,label:(cfg.groups||[]).find(g=>g.code===code)?.label||'',members:keys.map(k=>({key:k,name:nameOf.get(k)||''}))})),
    models:DD.sorted.map(m=>({name:m.name,key:keyOf(m.name),disc:m.disc||'',zone:m.zone||'',sub:isBlankSub(m.sub)?'':m.sub,type:m.type||'',group:m.group||'',

function checkModel(m,LR){

const LC_SYM={ok:'✓',miss:'✗',type:'⚠'};

  const have=new Set(models.map(m=>keyOf(m.name)));const fresh=new Map();
  for(const r of LR.raw.models||[]){for(const n of [r.name,...(r.links||[]).map(l=>l.name)]){if(badLinkName(n))continue;const nm=stripRvt(n);const k=keyOf(nm);if(nm&&k&&!have.has(k)&&!fresh.has(k))fresh.set(k,nm)}}
  const adds=[...fresh.values()].map(nm=>{const x=parseModelName(nm);const m={name:x.name,disc:x.disc,zone:x.zone,sub:x.sub};return{...m,key:keyOf(x.name),type:/^GE?N$/.test(m.disc)?'Datum model':guessType(m),links:linksFromReport(m,LR)||{ov:[],at:[]}}});
  const plan=[];for(const m of models){const x=linksFromReport(m,LR);if(x&&(!same(x.ov,m.ov)||!same(x.at,m.at)))plan.push({m,key:keyOf(m.name),...x})}
  return{adds,plan};
}
async function writeLinksFromReport(opts){
  opts=opts&&typeof opts==='object'?opts:{};
  if(readOnlyGuard())return;const LR=getRep();if(!LR)return;
  const same=(a,b)=>JSON.stringify([...(a||[])].sort())===JSON.stringify([...(b||[])].sort());
  const have=new Set(models.map(m=>keyOf(m.name)));const fresh=new Map();
  for(const r of LR.raw.models||[]){for(const n of [r.name,...(r.links||[]).map(l=>l.name)]){if(badLinkName(n))continue;const nm=stripRvt(n);const k=keyOf(nm);if(nm&&k&&!have.has(k)&&!fresh.has(k))fresh.set(k,nm)}}
  const adds=[...fresh.values()].map(nm=>{const x=parseModelName(nm);const m={name:x.name,disc:x.disc,zone:x.zone,sub:x.sub};return{...m,type:/^GE?N$/.test(m.disc)?'Datum model':guessType(m),links:linksFromReport(m,LR)||{ov:[],at:[]}}});
  let plan=[];for(const m of models){const x=linksFromReport(m,LR);if(x&&(!same(x.ov,m.ov)||!same(x.at,m.at)))plan.push({m,...x})}
  let adds2=adds;if(opts.only){adds2=adds.filter(a=>opts.only.has(keyOf(a.name)));plan=plan.filter(p=>opts.only.has(keyOf(p.m.name)))}
  if(!plan.length&&!adds2.length){toast(opts.only?'Nothing selected to write.':'The register already matches the links found in Revit.');return}
  const known=new Set([...models.map(m=>keyOf(m.name)),...fresh.keys(),...(cfg.groups||[]).map(g=>g.code)]);
  const unk=new Set();for(const p of [...plan,...adds.map(a=>a.links)])for(const t of [...p.ov,...p.at])if(!known.has(t))unk.add(t);
  const badCodes=[...new Set(adds.flatMap(a=>[(cfg.disciplines||[]).includes(a.disc)?'':a.disc,(cfg.zones||[]).some(z=>z.code===a.zone)?'':a.zone]).filter(Boolean))];
  const list=plan.slice(0,8).map(p=>`<b class="mono">${esc(keyOf(p.m.name))}</b>`).join(', ')+(plan.length>8?` and ${plan.length-8} more`:'');
  const addTxt=adds.length?`<b>${adds.length}</b> model(s) found in Revit are not in the register and will be added: <span class="mono">${esc(adds.slice(0,6).map(a=>keyOf(a.name)).join(', '))}${adds.length>6?'…':''}</span>.${badCodes.length?` Codes not in this project yet: <span class="mono">${esc(badCodes.join(', '))}</span> (add them in Codes).`:''}<br><br>`:'';
  if(!opts.noConfirm&&!await confirmBox(adds.length?'Add models and write links?':'Write links to the register?',`${addTxt}${plan.length?`The Overlay links and Attached links of <b>${plan.length}</b> model(s) will be replaced with the links found in Revit: ${list}.`:''}${unk.size?`<br><br>${unk.size} linked model(s) are not in the register yet and will show as "Unknown link": <span class="mono">${esc([...unk].slice(0,6).join(', '))}${unk.size>6?'…':''}</span>`:''}<br><br>You can undo this with Undo.`,'Write links'))return;
  act('Write links from Revit');
  logAct('Links written from Revit',`${plan.length} models`,`From ${LR.raw.file||'link_report.json'}`);
  let n=0,a=0;
  const S=[...models].sort((x,y)=>(x.order||0)-(y.order||0));let top=S.length?Math.max(...S.map(x=>x.order||0)):0;
  for(const m of adds2){const same=S.filter(x=>x.disc===m.disc);const order=same.length?(same[same.length-1].order||0)+0.01*(a+1):(top+=10);
    if(await writeModel(newId(),{name:m.name,disc:m.disc,zone:m.zone,sub:m.sub,type:m.type,desc:'',levels:'',content:'',parent:'–',group:'',set:'',ov:m.links.ov,at:m.links.at,order}))a++;else break}
  n=await pool(plan,p=>writeModel(p.m.id,{...clean(p.m),ov:p.ov,at:p.at}));
  if(a)logAct('Models added from Revit',`${a} model${a===1?'':'s'}`,`From ${LR.raw.file||'link_report.json'}`);
  toast(`${a?`${a} model(s) added, `:''}links written for ${n+a} model(s)`);
}
function repBar(LR,chk){
  const raw=LR.raw,c=[...chk.values()];const known=new Set(models.map(m=>keyOf(m.name)));
  const t={ok:0,miss:0,type:0,extra:0};let checked=0,failed=0,clean=0,skipped=0,notacc=0;
  for(const x of c){if(x.state==='notonacc')notacc++;if(x.state==='failed'){if(x.skipped)skipped++;else failed++}if(x.state!=='ok')continue;checked++;for(const k in t)t[k]+=x.n[k];if(!x.n.miss&&!x.n.type&&!x.n.extra)clean++}
  const notIn=[...LR.byKey.keys()].filter(k=>!known.has(k));
  const when=raw.generated?new Date(raw.generated).toLocaleString():'';
  const bad=c.filter(x=>(x.state==='failed'&&!x.skipped)||(x.state==='ok'&&(x.n.miss||x.n.type||x.n.extra))).length;
  return `<div class="card lcbar"><span class="lt">Link report</span><span class="lm">${esc(raw.file||'link_report.json')}${when?' · '+esc(when):''}${raw.revit?' · Revit '+esc(raw.revit):''}</span>
  <span class="lcs"><span>${checked} of ${models.length} models checked</span><span class="ok">${clean} clean</span>${failed?`<span class="fail">${failed} could not open</span>`:''}${skipped?`<span class="extra">${skipped} not checked</span>`:''}${notacc?`<span class="extra">${notacc} not on ACC yet</span>`:''}</span>
  <span class="lcs"><span class="ok">✓ ${t.ok}</span><span class="miss">✗ ${t.miss} missing</span><span class="type">⚠ ${t.type} wrong type</span><span class="extra">+${t.extra} extra</span></span>
  ${notIn.length?`<span class="lm" title="${esc(notIn.join(', '))}">${notIn.length} report models not in the register</span>`:''}<span class="grow"></span>
  <button class="chip" id="lcOnly" aria-pressed="${!!filt.lc}">Link problems (${bad})</button>${canWrite?`<button class="btn primary" id="lcWrite" type="button" title="Add the models found in Revit and put their links into the Overlay links and Attached links columns">Add models &amp; write links</button>`:''}<button class="btn ghost danger" id="lcClear" type="button">Clear</button></div>`;
}

let sjLoad=null;
function loadSheetJS(){return sjLoad??=new Promise((res,rej)=>{if(window.XLSX)return res(window.XLSX);const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>res(window.XLSX);s.onerror=()=>{sjLoad=null;rej(new Error('Excel reader could not load'))};document.head.appendChild(s)})}
/* ===== robust Excel import (SheetJS reader) ===== */
async function doImport(file){
  try{
    const X=await loadSheetJS();const wb=X.read(await file.arrayBuffer(),{type:'array'});
    const sheet=n=>X.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''}).map(r=>r.map(c=>String(c??'').trim()));
    const regName=wb.SheetNames.find(n=>sheet(n).slice(0,15).some(r=>r.includes('Model File Name')));
    if(!regName)throw new Error('No sheet with a "Model File Name" column was found.');
    const rows=sheet(regName);const hr=rows.findIndex(r=>r.includes('Model File Name'));const map={};rows[hr].forEach((h,i)=>{if(h)map[h]=i});
    const g=(r,h)=>map[h]!==undefined?(r[map[h]]||''):'';const sp=v=>String(v||'').split(/[,\s]+/).map(s=>s.trim()).filter(Boolean);
    const out=[];for(const r of rows.slice(hr+1)){const n=g(r,'Model File Name');if(!/^[A-Za-z0-9]+-[A-Za-z0-9.]+-/.test(n))continue;
      out.push({name:n,disc:g(r,'Discipline'),zone:g(r,'Zone'),sub:g(r,'Sub-Zone')||'–',desc:g(r,'Description').replace(/↳/g,'').trim(),content:g(r,'Content'),levels:g(r,'Levels Covered'),type:normType(g(r,'Model Type')),parent:g(r,'Parent Model'),group:g(r,'Group'),set:g(r,'Workset Set'),ov:sp(g(r,'Overlay Links')),at:sp(g(r,'Attached Links')),order:(out.length+1)*10})}
    if(!out.length)throw new Error('No model rows were found under the header.');
    const ncfg=JSON.parse(JSON.stringify(cfg));delete ncfg.id;
    const pre=out[0].name.split('-');ncfg.company=pre[0];ncfg.project=pre[1];
    let ng=0,ns=0;
    if(wb.SheetNames.includes('Codes')){const cr=sheet('Codes');const gH=cr.findIndex(r=>r[0]==='Group'&&r[1]==='Label');const sH=cr.findIndex(r=>r[0]==='Set'&&r[1]==='Workset');
      for(const r of cr){if(r[0]==='Project'&&r[1])ncfg.project=r[1];if(r[0]==='Company'&&r[1])ncfg.company=r[1]}
      if(gH>=0){const gs=[];for(let i=gH+1;cr[i]&&cr[i][0]&&!cr[i][0].startsWith('▲');i++){const r=cr[i];gs.push({code:r[0],label:r[1]||'',filePattern:r[2]||'',linkPattern:r[3]||''})}if(gs.length){ncfg.groups=gs;ng=gs.length}}
      if(sH>=0){const sets={},order=[];for(let i=sH+1;cr[i]&&cr[i][0]&&!cr[i][0].startsWith('▲');i++){const r=cr[i],s=r[0];if(!sets[s]){sets[s]={usedFor:r[3]||'',items:[]};order.push(s)}sets[s].items.push([r[1]||'',r[2]||''])}if(order.length){ncfg.sets=sets;ncfg.setOrder=order;ns=order.length}}}
    const ok=await confirmBox('Replace this project\'s data?',`Found <b>${out.length}</b> models${ng?`, ${ng} groups`:''}${ns?` and ${ns} workset sets`:''} in <b>${esc(file.name)}</b>. This replaces the ${models.length} models in project ${esc(projLabel(cfg))}.`,'Replace');
    if(!ok)return;
    banner('Importing… keep this page open.');
    await pdoc().set(ncfg);
    for(const m of [...models])await mcol().doc(m.id).delete();
    let i=0;for(const m of out){i++;banner(`Importing… ${i} / ${out.length}`);await mcol().doc(newId()).set(m)}
    logAct('Excel imported',file.name,`${out.length} models replaced ${models.length}${ng?`, ${ng} groups`:''}${ns?`, ${ns} workset sets`:''}`);banner('');toast(`Imported ${out.length} models`);
  }catch(e){banner('');toast('Import failed: '+(e?.message||e?.code||e))}
}
